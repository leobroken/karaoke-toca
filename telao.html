<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telão - Toca do Guerreiro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-black text-zinc-100 min-h-screen overflow-hidden select-none">
    <div id="root"></div>

    <script>
        const { useState, useEffect, useRef } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyCW9c9Uv0kekNSu1E6Y32toewgWm4Ngeps",
            authDomain: "karaoke-toca-30cf3.firebaseapp.com",
            projectId: "karaoke-toca-30cf3",
            storageBucket: "karaoke-toca-30cf3.firebasestorage.app",
            messagingSenderId: "722633752685",
            appId: "1:722633752685:web:7ac81abddc58e9aef27f64"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        function getYouTubeEmbedUrl(url) {
            if (!url) return '';
            let videoId = '';
            if (url.includes('youtu.be/')) {
                videoId = url.split('youtu.be/')[1]?.split('?')[0];
            } else if (url.includes('watch?v=')) {
                videoId = url.split('watch?v=')[1]?.split('&')[0];
            } else if (url.includes('embed/')) {
                videoId = url.split('embed/')[1]?.split('?')[0];
            } else {
                videoId = url;
            }
            return videoId ? `https://www.youtube.com/embed/${videoId}?autoplay=1&enablejsapi=1` : '';
        }

        function TelaoApp() {
            const [activePlayingSong, setActivePlayingSong] = useState(null);
            const [backgroundSongActive, setBackgroundSongActive] = useState(null);
            const [autoSkipEnabled, setAutoSkipEnabled] = useState(false);
            const [timeLeft, setTimeLeft] = useState(300);
            const [introCountdown, setIntroCountdown] = useState(null);
            
            const introTimerRef = useRef(null);
            const timerRef = useRef(null);
            const intervalRef = useRef(null);

            const handleNextSong = async () => {
                try {
                    const snapshot = await db.collection('queue').orderBy('createdAt', 'asc').limit(1).get();
                    if (snapshot.empty) {
                        await db.collection('settings').doc('activePlaying').set({ song: null });
                        return;
                    }
                    const currentDoc = snapshot.docs[0];
                    const current = { id: currentDoc.id, ...currentDoc.data() };

                    await db.collection('history').add({
                        title: current.title,
                        artist: current.artist,
                        user: current.user,
                        phone: current.phone || '',
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    
                    await db.collection('queue').doc(current.id).delete();

                    const nextSnapshot = await db.collection('queue').orderBy('createdAt', 'asc').limit(1).get();
                    if (!nextSnapshot.empty) {
                        const nextSong = { id: nextSnapshot.docs[0].id, ...nextSnapshot.docs[0].data() };
                        if (nextSong.youtubeLink) {
                            const embedUrl = getYouTubeEmbedUrl(nextSong.youtubeLink);
                            await db.collection('settings').doc('backgroundSong').set({ song: null });
                            await db.collection('settings').doc('activePlaying').set({ 
                                song: { ...nextSong, embedUrl: embedUrl } 
                            });
                        }
                    } else {
                        await db.collection('settings').doc('activePlaying').set({ song: null });
                    }
                } catch (error) {
                    console.error("Erro ao avançar música: ", error);
                }
            };

            useEffect(() => {
                const unsubActive = db.collection('settings').doc('activePlaying').onSnapshot(doc => {
                    if (doc.exists) {
                        const newSong = doc.data().song || null;
                        if (newSong && (!activePlayingSong || activePlayingSong.id !== newSong.id)) {
                            triggerIntroVinheta(newSong);
                        } else if (!newSong) {
                            setActivePlayingSong(null);
                        }
                    }
                });

                const unsubAutoSkip = db.collection('settings').doc('autoSkip').onSnapshot(doc => {
                    if (doc.exists) {
                        setAutoSkipEnabled(doc.data().enabled || false);
                    }
                });

                const unsubBg = db.collection('settings').doc('backgroundSong').onSnapshot(doc => {
                    if (doc.exists) {
                        setBackgroundSongActive(doc.data().song || null);
                    }
                });

                return () => {
                    unsubActive();
                    unsubAutoSkip();
                    unsubBg();
                };
            }, [activePlayingSong]);

            const triggerIntroVinheta = (song) => {
                if (introTimerRef.current) clearInterval(introTimerRef.current);
                setIntroCountdown({ song, count: 5 });

                let currentCount = 5;
                introTimerRef.current = setInterval(() => {
                    currentCount -= 1;
                    if (currentCount > 0) {
                        setIntroCountdown({ song, count: currentCount });
                    } else {
                        clearInterval(introTimerRef.current);
                        setIntroCountdown(null);
                        setActivePlayingSong(song);
                    }
                }, 1000);
            };

            useEffect(() => {
                if (introCountdown) return;

                if (timerRef.current) clearTimeout(timerRef.current);
                if (intervalRef.current) clearInterval(intervalRef.current);

                if (autoSkipEnabled && activePlayingSong && activePlayingSong.embedUrl) {
                    setTimeLeft(300);
                    intervalRef.current = setInterval(() => {
                        setTimeLeft(prev => prev > 1 ? prev - 1 : 0);
                    }, 1000);

                    timerRef.current = setTimeout(() => {
                        handleNextSong();
                    }, 5 * 60 * 1000);
                } else {
                    setTimeLeft(300);
                }

                return () => {
                    if (timerRef.current) clearTimeout(timerRef.current);
                    if (intervalRef.current) clearInterval(intervalRef.current);
                };
            }, [activePlayingSong, autoSkipEnabled, introCountdown]);

            const formatTime = (seconds) => {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
            };

            const currentPlaying = activePlayingSong || backgroundSongActive;

            return React.createElement(
                'div',
                { className: 'fixed inset-0 bg-black flex flex-col items-center justify-center p-4 overflow-hidden' },
                introCountdown ? React.createElement(
                    'div',
                    { className: 'absolute inset-0 bg-zinc-950 flex flex-col items-center justify-center z-50 p-6 text-center' },
                    React.createElement(
                        'div',
                        { className: 'bg-gradient-to-br from-amber-500/20 to-zinc-900 border border-amber-500/50 p-10 rounded-3xl shadow-2xl max-w-2xl w-full' },
                        React.createElement('span', { className: 'text-amber-400 font-bold uppercase tracking-widest text-base block mb-2' }, '🎤 Próxima Performance'),
                        React.createElement(
                            'h2',
                            { className: 'text-5xl font-extrabold text-zinc-100 mb-3' },
                            'Atenção, ',
                            React.createElement('span', { className: 'text-amber-400' }, introCountdown.song.user),
                            '!'
                        ),
                        React.createElement(
                            'p',
                            { className: 'text-zinc-300 text-xl mb-6' },
                            'Sua música ',
                            React.createElement('span', { className: 'font-bold text-amber-300' }, `"${introCountdown.song.title}"`),
                            ' começa em:'
                        ),
                        React.createElement('div', { className: 'w-36 h-36 mx-auto rounded-full bg-amber-500 text-zinc-950 flex items-center justify-center text-7xl font-black shadow-lg shadow-amber-500/40 animate-bounce' }, introCountdown.count)
                    )
                ) : null,
                React.createElement(
                    'div',
                    { className: 'absolute top-4 left-6 flex items-center gap-3 z-10' },
                    React.createElement('span', { className: 'bg-amber-500 text-zinc-950 font-black px-4 py-1.5 rounded-xl text-sm uppercase tracking-wider' }, '🖥️ Telão Toca do Guerreiro'),
                    currentPlaying && React.createElement(
                        'span',
                        { className: 'bg-zinc-900 border border-zinc-800 text-zinc-300 px-4 py-1.5 rounded-xl text-sm font-bold' },
                        backgroundSongActive ? React.createElement('span', { className: 'text-emerald-400' }, '🎵 Tocando som ambiente / fundo do bar') : React.createElement(
                            'span',
                            null,
                            'Cantando agora: ',
                            React.createElement('span', { className: 'text-amber-400' }, currentPlaying.user),
                            ' — ',
                            currentPlaying.title,
                            ' (',
                            currentPlaying.artist,
                            ')'
                        )
                    )
                ),
                React.createElement(
                    'div',
                    { className: 'w-full max-w-6xl aspect-video bg-zinc-900 border border-zinc-800 rounded-2xl overflow-hidden shadow-2xl flex items-center justify-center relative' },
                    currentPlaying && currentPlaying.embedUrl ? React.createElement('iframe', {
                        className: 'w-full h-full border-0',
                        src: currentPlaying.embedUrl,
                        title: 'Media Player',
                        allow: 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture',
                        allowFullScreen: true
                    }) : React.createElement(
                        'div',
                        { className: 'text-center p-8' },
                        React.createElement('h2', { className: 'text-4xl font-extrabold text-amber-500 mb-2' }, 'Aguardando Próxima Música...'),
                        React.createElement('p', { className: 'text-zinc-400 text-lg' }, 'Peça uma música ou adicione uma música de fundo no Painel Admin 🎤')
                    )
                ),
                React.createElement(
                    'div',
                    { className: 'absolute bottom-4 right-6 z-10' },
                    autoSkipEnabled && activePlayingSong ? React.createElement(
                        'div',
                        { className: 'bg-zinc-900/90 backdrop-blur border border-amber-500/40 text-amber-400 font-bold px-6 py-3 rounded-xl shadow-xl flex items-center gap-2 text-sm' },
                        React.createElement('span', null, '⏳ Próxima música em:'),
                        React.createElement('span', { className: 'font-mono text-zinc-100 text-base bg-zinc-950 px-2.5 py-1 rounded-lg border border-zinc-800' }, formatTime(timeLeft))
                    ) : React.createElement(
                        'button',
                        {
                            onClick: backgroundSongActive ? async () => { await db.collection('settings').doc('backgroundSong').set({ song: null }); } : handleNextSong,
                            className: 'bg-amber-500 hover:bg-amber-600 text-zinc-950 font-bold px-6 py-3 rounded-xl shadow-lg transition-all text-sm'
                        },
                        backgroundSongActive ? '⏹️ Parar Música de Fundo' : '⏭️ Pular para Próxima da Fila'
                    )
                )
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(TelaoApp));
    </script>
</body>
</html>
