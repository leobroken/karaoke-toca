        function playBeep(isHigh = false) {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = 'sine';
                osc.frequency.value = isHigh ? 880 : 440;
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.4);

                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.4);
            } catch (e) {
                console.error("Erro ao reproduzir bip:", e);
            }
        }

        function playStarSound() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();

                const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51]; 
                notes.forEach((freq, index) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();

                    osc.type = 'triangle';
                    osc.frequency.value = freq;

                    const startTime = ctx.currentTime + (index * 0.08);
                    gain.gain.setValueAtTime(0.25, startTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.7);

                    osc.connect(gain);
                    gain.connect(ctx.destination);

                    osc.start(startTime);
                    osc.stop(startTime + 0.7);
                });
            } catch (e) {
                console.error("Erro ao reproduzir som de estrelas:", e);
            }
        }

        function getYouTubeVideoId(url) {
            if (!url) return '';
            let videoId = '';
            if (url.includes('youtu.be/')) {
                videoId = url.split('youtu.be/')[1]?.split('?')[0];
            } else if (url.includes('watch?v=')) {
                videoId = url.split('watch?v=')[1]?.split('&')[0];
            } else if (url.includes('embed/')) {
                videoId = url.split('embed/')[1]?.split('?')[0];
            } else {
                videoId = url;
            }
            return videoId;
        }

        async function fetchYouTubeApiLink(title, artist) {
            if (!YOUTUBE_API_KEY) return "";
            try {
                const query = encodeURIComponent(`${title} ${artist} karaoke instrumental com letra legendado -live -clip -ao-vivo`);
                const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=8&q=${query}&type=video&videoEmbeddable=true&key=${YOUTUBE_API_KEY}`;
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.items && data.items.length > 0) {
                    let selectedItem = data.items[0];
                    for (let item of data.items) {
                        const t = (item.snippet.title || '').toLowerCase();
                        if (t.includes('karaoke') || t.includes('karaokê') || t.includes('instrumental') || t.includes('com letra')) {
                            selectedItem = item;
                            break;
                        }
                    }
                    const videoId = selectedItem.id.videoId;
                    return `https://www.youtube.com/watch?v=${videoId}`;
                }
            } catch (e) {
                console.error("Erro ao buscar link na API do YouTube:", e);
            }
            return "";
        }

        function FloatingGuerreiro({ emoji, onFinish }) {
            const canvasRef = useRef(null);
            const videoRef = useRef(null);
            const animRef = useRef(null);

            const edgePositions = [
                { bottom: '1rem', left: '2rem' },
                { bottom: '1rem', right: '2rem' },
                { top: '4rem', left: '2rem' },
                { top: '4rem', right: '2rem' },
                { bottom: '1rem', left: '35%' },
                { bottom: '1rem', right: '35%' }
            ];
            const randomPos = useRef(edgePositions[Math.floor(Math.random() * edgePositions.length)]).current;

            useEffect(() => {
                const video = videoRef.current;
                const canvas = canvasRef.current;
                if (!video || !canvas) return;

                const ctx = canvas.getContext('2d', { willReadFrequently: true });
                video.src = GUERREIRO_VIDEOS[emoji];
                video.currentTime = 0;
                video.play().catch(e => console.error("Erro ao reproduzir guerreirinho flutuante:", e));

                const processFrame = () => {
                    if (video.paused || video.ended) {
                        onFinish();
                        return;
                    }

                    canvas.width = video.videoWidth || 320;
                    canvas.height = video.videoHeight || 180;

                    try {
                        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                        let frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
                        let data = frame.data;

                        for (let i = 0; i < data.length; i += 4) {
                            let red = data[i];
                            let green = data[i + 1];
                            let blue = data[i + 2];

                            if (green > 90 && red < 90 && blue < 90) {
                                data[i + 3] = 0;
                            }
                        }

                        ctx.putImageData(frame, 0, 0);
                    } catch (err) {
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    }
                    animRef.current = requestAnimationFrame(processFrame);
                };

                video.onplay = () => { processFrame(); };
                video.onended = () => { onFinish(); };

                return () => {
                    if (animRef.current) cancelAnimationFrame(animRef.current);
                };
            }, [emoji, onFinish]);

            return React.createElement(
                'div',
                {
                    className: 'absolute pointer-events-none z-40 flex items-center justify-center',
                    style: randomPos
                },
                React.createElement('video', {
                    ref: videoRef,
                    style: { display: 'none' },
                    muted: true,
                    playsInline: true,
                    crossOrigin: 'anonymous'
                }),
                React.createElement('canvas', {
                    ref: canvasRef,
                    className: 'max-h-28 sm:max-h-40 w-auto drop-shadow-2xl'
                })
            );
        }

        function FloatingTelaoMirror({ onClose }) {
            const [position, setPosition] = useState({ x: 20, y: 80 });
            const isDragging = useRef(false);
            const dragOffset = useRef({ x: 0, y: 0 });
            const containerRef = useRef(null);

            const handleTouchStart = (e) => {
                isDragging.current = true;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                dragOffset.current = {
                    x: clientX - position.x,
                    y: clientY - position.y
                };
            };

            const handleTouchMove = (e) => {
                if (!isDragging.current) return;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                setPosition({
                    x: clientX - dragOffset.current.x,
                    y: clientY - dragOffset.current.y
                });
            };

            const handleTouchEnd = () => {
                isDragging.current = false;
            };

            useEffect(() => {
                const onMouseMove = (e) => {
                    if (!isDragging.current) return;
                    setPosition({
                        x: e.clientX - dragOffset.current.x,
                        y: e.clientY - dragOffset.current.y
                    });
                };
                const onMouseUp = () => { isDragging.current = false; };

                window.addEventListener('mousemove', onMouseMove);
                window.addEventListener('mouseup', onMouseUp);
                window.addEventListener('touchmove', handleTouchMove);
                window.addEventListener('touchend', handleTouchEnd);

                return () => {
                    window.removeEventListener('mousemove', onMouseMove);
                    window.removeEventListener('mouseup', onMouseUp);
                    window.removeEventListener('touchmove', handleTouchMove);
                    window.removeEventListener('touchend', handleTouchEnd);
                };
            }, []);

            const telaoMirrorUrl = window.location.pathname + '?telao=true';

            return React.createElement(
                'div',
                {
                    ref: containerRef,
                    style: { left: `${position.x}px`, top: `${position.y}px` },
                    className: 'fixed z-50 w-80 bg-zinc-900 border-2 border-amber-500 rounded-2xl shadow-2xl overflow-hidden select-none'
                },
                React.createElement(
                    'div',
                    {
                        onMouseDown: handleTouchStart,
                        onTouchStart: handleTouchStart,
                        className: 'bg-amber-500 text-zinc-950 px-3.5 py-2 flex items-center justify-between cursor-move font-extrabold text-xs'
                    },
                    React.createElement('span', null, '🖥️ Espelho do Telão (Arraste aqui)'),
                    React.createElement('button', {
                        onClick: onClose,
                        className: 'bg-zinc-950 text-amber-400 hover:bg-zinc-900 w-6 h-6 rounded-full flex items-center justify-center text-xs font-black shadow'
                    }, '✕')
                ),
                React.createElement(
                    'div',
                    { className: 'w-full aspect-video bg-black relative' },
                    React.createElement('iframe', {
                        src: telaoMirrorUrl,
                        className: 'w-full h-full border-0 pointer-events-none'
                    })
                ),
                React.createElement(
                    'div',
                    { className: 'px-3 py-1.5 bg-zinc-950 text-[10px] text-zinc-400 text-center font-medium' },
                    'Transmissão ao vivo idêntica ao telão oficial'
                )
            );
        }

        function App() {

            const [songTitle, setSongTitle] = useState('');

            const queueRef = useRef(queue);
            useEffect(() => { queueRef.current = queue; }, [queue]);

            const [history, setHistory] = useState([]);
            const [activeGuerreiros, setActiveGuerreiros] = useState([]);
            const [starMessages, setStarMessages] = useState([]);

            const [isPaused, setIsPaused] = useState(false);
            const [isTelaoMode, setIsTelaoMode] = useState(false);
            const [activePlayingSong, setActivePlayingSong] = useState(null);
            
            const [backgroundLinkInput, setBackgroundLinkInput] = useState('');
            const [backgroundSongActive, setBackgroundSongActive] = useState(null);
            const [isTelaoMutedState, setIsTelaoMutedState] = useState(false);

            const [showAdminMirror, setShowAdminMirror] = useState(false);

            const [introCountdown, setIntroCountdown] = useState(null);
            const introTimerRef = useRef(null);

            const [showPausedModal, setShowPausedModal] = useState(false);
            const [isVideoMuted, setIsVideoMuted] = useState(true);
            const videoRef = useRef(null);

            const [isAdmin, setIsAdmin] = useState(() => {
                const adminSaved = localStorage.getItem('toca_karaoke_admin');
                if (adminSaved) {
                    const adminData = JSON.parse(adminSaved);
                    if (new Date().getTime() - adminData.timestamp < 24 * 60 * 60 * 1000) return true;
                }
                return false;
            });

            const [adminModal, setAdminModal] = useState(false);
            const [adminPassword, setAdminPassword] = useState('');
            const [editingSong, setEditingSong] = useState(null);
            const [youtubeInputs, setYoutubeInputs] = useState({});

            const [usersList, setUsersList] = useState([]);
            const [mutedPhones, setMutedPhones] = useState({});
            const [showUsersModal, setShowUsersModal] = useState(false);
            const [mutedAlertMessage, setMutedAlertMessage] = useState(null);

            const ytPlayerRef = useRef(null);
            const currentVideoIdRef = useRef(null);
            const lastSongIdProcessedRef = useRef(null);
            const checkEndIntervalRef = useRef(null);

            const activePlayingSongRef = useRef(activePlayingSong);
            useEffect(() => { activePlayingSongRef.current = activePlayingSong; }, [activePlayingSong]);

            const backgroundSongActiveRef = useRef(backgroundSongActive);
            useEffect(() => { backgroundSongActiveRef.current = backgroundSongActive; }, [backgroundSongActive]);

            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                if (params.get('telao') === 'true') {
                    setIsTelaoMode(true);
                }
            }, []);

            const triggerStarCelebration = () => {
                const newMsgId = Date.now() + Math.random();
                setStarMessages(prev => [...prev, newMsgId]);
                playStarSound();
                setTimeout(() => {
                    setStarMessages(prev => prev.filter(id => id !== newMsgId));
                }, 3000);
            };

            const handleNextSong = async () => {
                const currentQueue = queueRef.current;
                const currentActive = activePlayingSongRef.current;
                const currentBg = backgroundSongActiveRef.current;
                
                if (currentActive && currentActive.id && !currentBg && !currentActive.isBackground) {
                    try {
                        await db.collection('history').add({
                            title: currentActive.title,
                            artist: currentActive.artist,
                            user: currentActive.user,
                            phone: currentActive.phone || '',
                            reactions: { '🙉': 0, '❤️': 0, '👏': 0 },
                            reactedUsers: {},
                            createdAt: firebase.firestore.FieldValue.serverTimestamp()
                        });
                    } catch (err) {
                        console.error("Erro ao salvar histórico ao avançar:", err);
                    }
                }

                if (currentQueue.length === 0) {
                    await db.collection('settings').doc('activePlaying').set({ song: null });
                    return;
                }

                const current = currentQueue[0];
                try {
                    await db.collection('queue').doc(current.id).delete();

                    const nextSong = currentQueue.length > 1 ? currentQueue[1] : null;
                    if (nextSong && nextSong.youtubeLink) {
                        const videoId = getYouTubeVideoId(nextSong.youtubeLink);
                        await db.collection('settings').doc('activePlaying').set({ 
                            song: { ...nextSong, videoId: videoId, timestamp: Date.now() } 
                        });
                    } else {
                        await db.collection('settings').doc('activePlaying').set({ song: null });
                    }
                } catch (error) {
                    console.error("Erro ao avançar música: ", error);
                }
            };

            useEffect(() => {
                const unsubQueue = db.collection('queue').orderBy('createdAt', 'asc').onSnapshot(snapshot => {
                    const items = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setQueue(items);
                });

                const unsubHistory = db.collection('history').orderBy('createdAt', 'desc').onSnapshot(snapshot => {
                    const items = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setHistory(items);
                });

                const unsubCelebration = db.collection('settings').doc('celebration').onSnapshot(doc => {
                    if (doc.exists && isTelaoMode) {
                        const data = doc.data();
                        if (data && data.timestamp && (Date.now() - data.timestamp < 5000)) {
                            if (data.emoji && GUERREIRO_VIDEOS[data.emoji]) {
                                // TRAVA DE SEGURANÇA: Só exibe o vídeo se já não houver outro guerreirinho do mesmo emoji ativo na tela
                                setActiveGuerreiros(prev => {
                                    const alreadyPlaying = prev.some(g => g.emoji === data.emoji);
                                    if (alreadyPlaying) return prev; // Se já está passando, ignora para não sobrecarregar
                                    const newId = Date.now() + Math.random();
                                    return [...prev, { id: newId, emoji: data.emoji }];
                                });
                            }
                            if (data.type === 'stars') {
                                triggerStarCelebration();
                            }
                        }
                    }
                });

                const unsubSettings = db.collection('settings').doc('status').onSnapshot(doc => {
                    if (doc.exists) setIsPaused(doc.data().paused || false);
                });

                const unsubActive = db.collection('settings').doc('activePlaying').onSnapshot(doc => {
                    if (doc.exists) {
                        const newSong = doc.data().song || null;
                        setActivePlayingSong(newSong);
                    }
                });

                const unsubBg = db.collection('settings').doc('backgroundSong').onSnapshot(doc => {
                    if (doc.exists) setBackgroundSongActive(doc.data().song || null);
                });

                const unsubTelaoMute = db.collection('settings').doc('telaoMute').onSnapshot(doc => {
                    if (doc.exists) {
                        const muted = doc.data().muted || false;
                        setIsTelaoMutedState(muted);
                        if (ytPlayerRef.current && typeof ytPlayerRef.current.pauseVideo === 'function' && typeof ytPlayerRef.current.playVideo === 'function') {
                            if (muted) ytPlayerRef.current.pauseVideo();
                            else ytPlayerRef.current.playVideo();
                        }
                    }
                });

                const unsubUsers = db.collection('users').onSnapshot(snapshot => {
                    const items = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setUsersList(items);
                });

                const unsubMuted = db.collection('settings').doc('mutedUsers').onSnapshot(doc => {
                    if (doc.exists) setMutedPhones(doc.data() || {});
                });

                return () => {
                    unsubQueue();
                    unsubHistory();
                    unsubCelebration();
                    unsubSettings();
                    unsubActive();
                    unsubBg();
                    unsubTelaoMute();
                    unsubUsers();
                    unsubMuted();
                };
            }, [isTelaoMode]);

            useEffect(() => {
                if (!isTelaoMode || !activePlayingSong || activePlayingSong.isBackground) return;
                
                const songUniqueKey = `${activePlayingSong.id || activePlayingSong.videoId}-${activePlayingSong.timestamp || 0}`;
                if (lastSongIdProcessedRef.current === songUniqueKey) return;
                lastSongIdProcessedRef.current = songUniqueKey;

                let count = 5;
                setIntroCountdown({ song: activePlayingSong, count: count });
                playBeep(false);

                if (introTimerRef.current) clearInterval(introTimerRef.current);

                introTimerRef.current = setInterval(() => {
                    count--;
                    if (count > 0) {
                        playBeep(false);
                        setIntroCountdown(prev => prev ? { ...prev, count: count } : null);
                    } else {
                        playBeep(true);
                        clearInterval(introTimerRef.current);
                        setIntroCountdown(null);
                        if (ytPlayerRef.current && typeof ytPlayerRef.current.playVideo === 'function' && !isTelaoMutedState) {
                            ytPlayerRef.current.unMute();
                            ytPlayerRef.current.playVideo();
                        }
                    }
                }, 1000);

                return () => {
                    if (introTimerRef.current) clearInterval(introTimerRef.current);
                };
            }, [activePlayingSong, isTelaoMode]);

            useEffect(() => {
                if (queue.length === 0 && backgroundSongActive && !activePlayingSong) {
                    const videoId = backgroundSongActive.videoId || getYouTubeVideoId(backgroundSongActive.youtubeLink);
                    if (videoId) {
                        db.collection('settings').doc('activePlaying').set({ 
                            song: { ...backgroundSongActive, videoId: videoId, isBackground: true, timestamp: Date.now() } 
                        });
                    }
                }
            }, [queue, backgroundSongActive, activePlayingSong]);

            useEffect(() => {
                if (!isTelaoMode) return;
                if (checkEndIntervalRef.current) clearInterval(checkEndIntervalRef.current);

                checkEndIntervalRef.current = setInterval(() => {
                    if (ytPlayerRef.current && typeof ytPlayerRef.current.getCurrentTime === 'function' && typeof ytPlayerRef.current.getDuration === 'function') {
                        const currentTime = ytPlayerRef.current.getCurrentTime();
                        const duration = ytPlayerRef.current.getDuration();
                        const currentActive = activePlayingSongRef.current;

                        if (currentActive && currentActive.isBackground && currentTime > 0) {
                            db.collection('settings').doc('backgroundSong').update({ 'song.savedTime': currentTime }).catch(() => {});
                        }

                        if (duration > 0 && currentTime > 0 && (duration - currentTime < 0.8)) {
                            clearInterval(checkEndIntervalRef.current);
                            if (!currentActive || !currentActive.isBackground) handleNextSong();
                            else {
                                ytPlayerRef.current.seekTo(0);
                                ytPlayerRef.current.playVideo();
                            }
                        }
                    }
                }, 1000);

                return () => {
                    if (checkEndIntervalRef.current) clearInterval(checkEndIntervalRef.current);
                };
            }, [isTelaoMode, activePlayingSong]);

            useEffect(() => {
                if (!isTelaoMode) return;
                const currentPlaying = activePlayingSong;
                const videoId = currentPlaying ? (currentPlaying.videoId || getYouTubeVideoId(currentPlaying.youtubeLink)) : null;

                if (!videoId) {
                    if (ytPlayerRef.current && typeof ytPlayerRef.current.destroy === 'function') {
                        ytPlayerRef.current.destroy();
                        ytPlayerRef.current = null;
                    }
                    currentVideoIdRef.current = null;
                    return;
                }

                if (ytPlayerRef.current && typeof ytPlayerRef.current.loadVideoById === 'function') {

                                const cleanP = u.phone ? u.phone.replace(/\D/g, '') : '';
                                const isMuted = !!mutedPhones[cleanP];
                                return React.createElement(
                                    'div',
                                    { key: u.id, className: 'bg-zinc-950 border border-zinc-800 p-3.5 rounded-xl flex items-center justify-between gap-3' },
                                    React.createElement('div', null, React.createElement('h4', { className: 'font-bold text-zinc-100 text-sm' }, u.name), React.createElement('p', { className: 'text-xs text-zinc-400 font-mono' }, u.phone)),
                                    React.createElement(
                                        'div',
                                        { className: 'flex items-center gap-2' },
                                        React.createElement('button', { onClick: () => handleToggleMuteUser(u.phone), className: `text-xs font-bold px-3 py-2 rounded-xl border ${isMuted ? 'bg-red-500 text-zinc-950 border-red-400' : 'bg-zinc-800 text-zinc-300 border-zinc-700'}` }, isMuted ? '🔇 Silenciado' : '🔊 Silenciar'),
                                        React.createElement('button', { onClick: () => handleDeleteUser(u.id, u.name), className: 'text-xs font-bold px-3 py-2 rounded-xl bg-red-500/20 text-red-400 border border-red-500/30' }, '🗑️ Deletar')
                                    )
                                );
                            })

                        React.createElement('div', { className: 'mt-4 pt-3 border-t border-zinc-800' }, React.createElement('button', { onClick: () => setShowUsersModal(false), className: 'w-full bg-zinc-800 text-zinc-200 font-bold py-2.5 rounded-xl text-sm' }, 'Fechar'))
                    )
                ),
                adminModal && React.createElement(
                    'div',
                    { className: 'fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50' },
                    React.createElement(
                        'div',
                        { className: 'bg-zinc-900 border border-zinc-800 rounded-2xl p-6 w-full max-w-md shadow-2xl' },
                        React.createElement('h3', { className: 'text-lg font-bold text-zinc-100 mb-2' }, 'Acesso Restrito'),
                        React.createElement('p', { className: 'text-xs text-zinc-400 mb-4' }, 'Insira a senha de administrador:'),
                        React.createElement(
                            'form',
                            { onSubmit: handleAdminLogin, className: 'space-y-4' },
                            React.createElement('input', {
                                type: 'password', required: true, value: adminPassword,
                                onChange: (e) => setAdminPassword(e.target.value), placeholder: 'Senha',
                                className: 'w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-zinc-100 focus:outline-none focus:border-amber-500 text-sm'
                            }),
                            React.createElement(
                                'div',
                                { className: 'flex gap-3' },
                                React.createElement('button', { type: 'button', onClick: () => setAdminModal(false), className: 'w-1/2 bg-zinc-800 text-zinc-300 font-medium py-3 rounded-xl text-sm' }, 'Cancelar'),
                                React.createElement('button', { type: 'submit', className: 'w-1/2 bg-amber-500 text-zinc-950 font-bold py-3 rounded-xl shadow-lg text-sm' }, 'Entrar')
                            )
                        )
                    )
                ),
                editingSong && React.createElement(
                    'div',
                    { className: 'fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-55' },
                    React.createElement(
                        'div',
                        { className: 'bg-zinc-900 border border-zinc-800 rounded-2xl p-6 w-full max-w-md shadow-2xl' },
                        React.createElement('h3', { className: 'text-lg font-bold text-zinc-100 mb-4' }, 'Editar Música da Fila'),
                        React.createElement(
                            'form',
                            { onSubmit: handleSaveEdit, className: 'space-y-4' },
                            React.createElement(
                                'div',
                                null,
                                React.createElement('label', { className: 'block text-xs font-medium text-zinc-400 mb-1' }, 'Música'),
                                React.createElement('input', {
                                    type: 'text', required: true, value: editingSong.title,
                                    onChange: (e) => setEditingSong({ ...editingSong, title: e.target.value }),
                                    className: 'w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-2.5 text-zinc-100 text-sm'
                                })
                            ),
                            React.createElement(
                                'div',
                                null,
                                React.createElement('label', { className: 'block text-xs font-medium text-zinc-400 mb-1' }, 'Artista / Banda'),
                                React.createElement('input', {
                                    type: 'text', required: true, value: editingSong.artist,
                                    onChange: (e) => setEditingSong({ ...editingSong, artist: e.target.value }),
                                    className: 'w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-2.5 text-zinc-100 text-sm'
                                })
                            ),
                            React.createElement(
                                'div',
                                { className: 'flex gap-3 pt-2' },
                                React.createElement('button', { type: 'button', onClick: () => setEditingSong(null), className: 'w-1/2 bg-zinc-800 text-zinc-300 font-medium py-3 rounded-xl text-sm' }, 'Cancelar'),
                                React.createElement('button', { type: 'submit', className: 'w-1/2 bg-amber-500 text-zinc-950 font-bold py-3 rounded-xl text-sm shadow-lg' }, 'Salvar')
                            )
                        )
                    )
                )
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
    </script>
