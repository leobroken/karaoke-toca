        function playBeep(isHigh = false) {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = 'sine';
                osc.frequency.value = isHigh ? 880 : 440;
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.4);

                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.4);
            } catch (e) {
                console.error("Erro ao reproduzir bip:", e);
            }
        }

        function playStarSound() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();

                const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51]; 
                notes.forEach((freq, index) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();

                    osc.type = 'triangle';
                    osc.frequency.value = freq;

                    const startTime = ctx.currentTime + (index * 0.08);
                    gain.gain.setValueAtTime(0.25, startTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.7);

                    osc.connect(gain);
                    gain.connect(ctx.destination);

                    osc.start(startTime);
                    osc.stop(startTime + 0.7);
                });
            } catch (e) {
                console.error("Erro ao reproduzir som de estrelas:", e);
            }
        }

        function getYouTubeVideoId(url) {
            if (!url) return '';
            let videoId = '';
            if (url.includes('youtu.be/')) {
                videoId = url.split('youtu.be/')[1]?.split('?')[0];
            } else if (url.includes('watch?v=')) {
                videoId = url.split('watch?v=')[1]?.split('&')[0];
            } else if (url.includes('embed/')) {
                videoId = url.split('embed/')[1]?.split('?')[0];
            } else {
                videoId = url;
            }
            return videoId;
        }

        async function fetchYouTubeApiLink(title, artist, excludeVideoId = "") {
            if (!YOUTUBE_API_KEY) return "";
            try {
                const query = encodeURIComponent(`${title} ${artist} karaoke instrumental com letra legendado -live -clip -ao-vivo`);
                const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=10&q=${query}&type=video&videoEmbeddable=true&key=${YOUTUBE_API_KEY}`;
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.items && data.items.length > 0) {
                    let candidates = data.items.filter(item => item.id && item.id.videoId && item.id.videoId !== excludeVideoId);
                    if (candidates.length === 0) candidates = data.items;

                    let selectedItem = candidates[0];
                    for (let item of candidates) {
                        const t = (item.snippet.title || '').toLowerCase();
                        if (t.includes('karaoke') || t.includes('karaokê') || t.includes('instrumental') || t.includes('com letra')) {
                            selectedItem = item;
                            break;
                        }
                    }
                    const videoId = selectedItem.id.videoId;
                    return `https://www.youtube.com/watch?v=${videoId}`;
                }
            } catch (e) {
                console.error("Erro ao buscar link na API do YouTube:", e);
            }
            return "";
        }
