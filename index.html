<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karaokê - Toca do Guerreiro</title>
    <!-- Configuração para PWA (Instalar no Celular) -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f59e0b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Karaokê Toca">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel para compilar JSX no navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Firebase SDKs (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Configuração do Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyCW9c9Uv0kekNSu1E6Y32toewgWm4Ngeps",
            authDomain: "karaoke-toca-30cf3.firebaseapp.com",
            projectId: "karaoke-toca-30cf3",
            storageBucket: "karaoke-toca-30cf3.firebasestorage.app",
            messagingSenderId: "722633752685",
            appId: "1:722633752685:web:7ac81abddc58e9aef27f64"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        // Função auxiliar para extrair o ID do link do YouTube
        function getYouTubeEmbedUrl(url) {
            if (!url) return '';
            let videoId = '';
            if (url.includes('youtu.be/')) {
                videoId = url.split('youtu.be/')[1]?.split('?')[0];
            } else if (url.includes('watch?v=')) {
                videoId = url.split('watch?v=')[1]?.split('&')[0];
            } else if (url.includes('embed/')) {
                videoId = url.split('embed/')[1]?.split('?')[0];
            } else {
                videoId = url;
            }
            return videoId ? `https://www.youtube.com/embed/${videoId}?autoplay=1&enablejsapi=1` : '';
        }

        function App() {
            // Sessão do Usuário Comum com Nome e Celular
            const [user, setUser] = useState(() => {
                const saved = localStorage.getItem('toca_karaoke_user');
                if (saved) {
                    const data = JSON.parse(saved);
                    if (new Date().getTime() - data.timestamp < 12 * 60 * 60 * 1000) {
                        return data;
                    }
                }
                return null;
            });

            const [inputName, setInputName] = useState('');
            const [inputPhone, setInputPhone] = useState('');
            const [songTitle, setSongTitle] = useState('');
            const [songArtist, setSongArtist] = useState('');
            
            const [queue, setQueue] = useState([]);
            const [history, setHistory] = useState([]);
            const [ratings, setRatings] = useState({});
            const [isPaused, setIsPaused] = useState(false);
            const [isTelaoMode, setIsTelaoMode] = useState(false);
            const [activePlayingSong, setActivePlayingSong] = useState(null);
            
            const [showPausedModal, setShowPausedModal] = useState(false);
            const [isVideoMuted, setIsVideoMuted] = useState(true);
            const videoRef = useRef(null);

            // Sessão do Admin por 24 horas
            const [isAdmin, setIsAdmin] = useState(() => {
                const adminSaved = localStorage.getItem('toca_karaoke_admin');
                if (adminSaved) {
                    const adminData = JSON.parse(adminSaved);
                    if (new Date().getTime() - adminData.timestamp < 24 * 60 * 60 * 1000) {
                        return true;
                    }
                }
                return false;
            });

            const [adminModal, setAdminModal] = useState(false);
            const [adminPassword, setAdminPassword] = useState('');
            const [editingSong, setEditingSong] = useState(null);
            
            // Estado local temporário para digitação dos inputs de link antes de salvar
            const [youtubeInputs, setYoutubeInputs] = useState({});
            
            // Controle do Pular Automático (5 minutos)
            const [autoSkipEnabled, setAutoSkipEnabled] = useState(false);
            const timerRef = useRef(null);

            // Verificar se o modo telao foi ativado via URL (?telao=true)
            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                if (params.get('telao') === 'true') {
                    setIsTelaoMode(true);
                }
            }, []);

            // Sincronização em tempo real com o Firestore
            useEffect(() => {
                const unsubQueue = db.collection('queue').orderBy('createdAt', 'asc').onSnapshot(snapshot => {
                    const items = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setQueue(items);
                });

                const unsubHistory = db.collection('history').orderBy('createdAt', 'desc').onSnapshot(snapshot => {
                    const items = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setHistory(items);
                });

                const unsubRatings = db.collection('ratings').doc('data').onSnapshot(doc => {
                    if (doc.exists) {
                        setRatings(doc.data() || {});
                    }
                });

                const unsubSettings = db.collection('settings').doc('status').onSnapshot(doc => {
                    if (doc.exists) {
                        setIsPaused(doc.data().paused || false);
                    }
                });

                const unsubActive = db.collection('settings').doc('activePlaying').onSnapshot(doc => {
                    if (doc.exists) {
                        setActivePlayingSong(doc.data().song || null);
                    }
                });

                return () => {
                    unsubQueue();
                    unsubHistory();
                    unsubRatings();
                    unsubSettings();
                    unsubActive();
                };
            }, []);

            // Temporizador de 5 minutos caso o Pular Automático esteja ativado
            useEffect(() => {
                if (!isTelaoMode || !autoSkipEnabled || !activePlayingSong) {
                    if (timerRef.current) clearTimeout(timerRef.current);
                    return;
                }

                timerRef.current = setTimeout(() => {
                    handleNextSong();
                }, 5 * 60 * 1000);

                return () => {
                    if (timerRef.current) clearTimeout(timerRef.current);
                };
            }, [activePlayingSong, autoSkipEnabled, isTelaoMode, queue]);

            // Máscara automática para o telefone: (XX) XXXXX-XXXX
            const handlePhoneChange = (e) => {
                let value = e.target.value.replace(/\D/g, '');
                if (value.length > 11) value = value.slice(0, 11);
                
                if (value.length > 6) {
                    value = `(${value.slice(0, 2)}) ${value.slice(2, 7)}-${value.slice(7)}`;
                } else if (value.length > 2) {
                    value = `(${value.slice(0, 2)}) ${value.slice(2)}`;
                } else if (value.length > 0) {
                    value = `(${value}`;
                }
                setInputPhone(value);
            };

            const handleLogin = (e) => {
                e.preventDefault();
                if (!inputName.trim() || !inputPhone.trim()) return;
                const nameFormatted = inputName.trim();
                const phoneFormatted = inputPhone.trim();

                const userData = {
                    name: nameFormatted,
                    phone: phoneFormatted,
                    timestamp: new Date().getTime()
                };

                setUser(userData);
                localStorage.setItem('toca_karaoke_user', JSON.stringify(userData));
                setInputName('');
                setInputPhone('');
            };

            const handleLogout = () => {
                if (confirm('Deseja realmente sair da sua conta?')) {
                    localStorage.removeItem('toca_karaoke_user');
                    setUser(null);
                }
            };

            const userActiveSongsCount = user ? queue.filter(item => item.phone === user.phone).length : 0;

            const handleAddSong = async (e) => {
                e.preventDefault();
                
                if (isPaused) {
                    setIsVideoMuted(true);
                    setShowPausedModal(true);
                    return;
                }

                if (!songTitle.trim() || !songArtist.trim()) return;

                if (userActiveSongsCount >= 2) {
                    alert('Você já possui 2 músicas na fila! Aguarde uma delas tocar para pedir outra.');
                    return;
                }

                try {
                    await db.collection('queue').add({
                        title: songTitle.trim(),
                        artist: songArtist.trim(),
                        user: user.name,
                        phone: user.phone,
                        youtubeLink: '', // Inicializa vazio no banco
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    setSongTitle('');
                    setSongArtist('');
                    alert('Música enviada para o telão com sucesso! 🎤');
                } catch (error) {
                    console.error("Erro ao adicionar música: ", error);
                }
            };

            const handleUnmuteVideo = () => {
                if (videoRef.current) {
                    videoRef.current.muted = false;
                    videoRef.current.play();
                    setIsVideoMuted(false);
                }
            };

            const handleAdminLogin = (e) => {
                e.preventDefault();
                if (adminPassword === 'toca10karaoke') {
                    setIsAdmin(true);
                    localStorage.setItem('toca_karaoke_admin', JSON.stringify({ timestamp: new Date().getTime() }));
                    setAdminModal(false);
                    setAdminPassword('');
                } else {
                    alert('Senha incorreta!');
                }
            };

            const handleAdminLogout = () => {
                localStorage.removeItem('toca_karaoke_admin');
                setIsAdmin(false);
            };

            // Salvar o link do YouTube diretamente no Firebase para sincronizar entre todos os Admins
            const handleSaveYouTubeLink = async (songId) => {
                const linkToSave = youtubeInputs[songId] !== undefined ? youtubeInputs[songId] : (queue.find(i => i.id === songId)?.youtubeLink || '');
                if (!linkToSave.trim()) {
                    alert('Por favor, cole um link válido antes de salvar!');
                    return;
                }

                try {
                    await db.collection('queue').doc(songId).update({
                        youtubeLink: linkToSave.trim()
                    });
                    alert('Link salvo com sucesso e sincronizado para todos os administradores! 💾');
                } catch (error) {
                    console.error("Erro ao salvar link: ", error);
                    alert('Erro ao salvar o link.');
                }
            };

            const handlePlayOnTelao = async (song) => {
                // Pega o link salvo no banco ou o que está digitado no input local
                const link = youtubeInputs[song.id] !== undefined ? youtubeInputs[song.id] : (song.youtubeLink || '');
                if (!link.trim()) {
                    alert('Por favor, cole o link do YouTube da versão de karaokê e clique em "Salvar Link" antes de tocar!');
                    return;
                }

                const embedUrl = getYouTubeEmbedUrl(link);
                if (!embedUrl) {
                    alert('Link do YouTube inválido. Verifique o endereço copiado.');
                    return;
                }

                try {
                    // Salva também no banco caso ainda não tenha sido salvo
                    await db.collection('queue').doc(song.id).update({ youtubeLink: link.trim() });

                    await db.collection('settings').doc('activePlaying').set({ 
                        song: { ...song, youtubeLink: link.trim(), embedUrl: embedUrl } 
                    });
                } catch (error) {
                    console.error("Erro ao reproduzir no telão: ", error);
                }
            };

            // Avançar música automaticamente
            const handleNextSong = async () => {
                if (queue.length === 0) {
                    await db.collection('settings').doc('activePlaying').set({ song: null });
                    return;
                }
                const current = queue[0];
                try {
                    await db.collection('history').add({
                        title: current.title,
                        artist: current.artist,
                        user: current.user,
                        phone: current.phone || '',
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    
                    await db.collection('queue').doc(current.id).delete();

                    const nextSong = queue.length > 1 ? queue[1] : null;
                    if (nextSong && nextSong.youtubeLink) {
                        const embedUrl = getYouTubeEmbedUrl(nextSong.youtubeLink);
                        await db.collection('settings').doc('activePlaying').set({ 
                            song: { ...nextSong, embedUrl: embedUrl } 
                        });
                    } else {
                        await db.collection('settings').doc('activePlaying').set({ song: null });
                    }
                } catch (error) {
                    console.error("Erro ao avançar música: ", error);
                }
            };

            const handleDeleteSong = async (id) => {
                if (confirm('Tem certeza que deseja remover esta música da fila?')) {
                    await db.collection('queue').doc(id).delete();
                }
            };

            const handleSaveEdit = async (e) => {
                e.preventDefault();
                if (!editingSong.title.trim() || !editingSong.artist.trim()) return;

                await db.collection('queue').doc(editingSong.id).update({
                    title: editingSong.title.trim(),
                    artist: editingSong.artist.trim()
                });
                setEditingSong(null);
            };

            const handleResetNotes = async () => {
                if (confirm('Deseja realmente zerar o histórico e as notas das músicas tocadas?')) {
                    const batch = db.batch();
                    history.forEach(item => {
                        batch.delete(db.collection('history').doc(item.id));
                    });
                    batch.set(db.collection('ratings').doc('data'), {});
                    await batch.commit();
                }
            };

            const handleTogglePause = async () => {
                const newStatus = !isPaused;
                await db.collection('settings').doc('status').set({ paused: newStatus });
            };

            const openTelaoWindow = () => {
                window.open(window.location.pathname + '?telao=true', '_blank');
            };

            const handleRate = async (historyId, stars) => {
                const currentSongRatings = ratings[historyId] || {};
                const updatedSongRatings = { ...currentSongRatings, [user.phone]: stars };
                const newRatings = { ...ratings, [historyId]: updatedSongRatings };
                
                await db.collection('ratings').doc('data').set(newRatings);
            };

            const rankedHistory = history.map(item => {
                const itemRatings = ratings[item.id] || {};
                const values = Object.values(itemRatings);
                const avg = values.length > 0 ? (values.reduce((a, b) => a + b, 0) / values.length) : 0;
                return { ...item, avgRating: avg, totalVotes: values.length };
            }).sort((a, b) => b.avgRating - a.avgRating || b.totalVotes - a.totalVotes);

            const topSinger = rankedHistory.length > 0 && rankedHistory[0].avgRating > 0 ? rankedHistory[0] : null;

            // ==========================================
            // TELA DO MODO TELÃO
            // ==========================================
            if (isTelaoMode) {
                return (
                    <div className="fixed inset-0 bg-black flex flex-col items-center justify-center p-4 overflow-hidden select-none">
                        <div className="absolute top-4 left-6 flex items-center gap-3 z-10">
                            <span className="bg-amber-500 text-zinc-950 font-black px-4 py-1.5 rounded-xl text-sm shadow-lg shadow-amber-500/20 uppercase tracking-wider">
                                🖥️ Telão Toca do Guerreiro
                            </span>
                            {activePlayingSong && (
                                <span className="bg-zinc-900 border border-zinc-800 text-zinc-300 px-4 py-1.5 rounded-xl text-sm font-bold">
                                    Cantando agora: <span className="text-amber-400">{activePlayingSong.user}</span> — {activePlayingSong.title} ({activePlayingSong.artist})
                                </span>
                            )}
                        </div>

                        <div className="w-full max-w-5xl aspect-video bg-zinc-900 border border-zinc-800 rounded-2xl overflow-hidden shadow-2xl flex items-center justify-center relative">
                            {activePlayingSong && activePlayingSong.embedUrl ? (
                                <iframe 
                                    className="w-full h-full border-0"
                                    src={activePlayingSong.embedUrl}
                                    title="Karaokê Player"
                                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                                    allowFullScreen
                                ></iframe>
                            ) : (
                                <div className="text-center p-8">
                                    <h2 className="text-3xl font-extrabold text-amber-500 mb-2">Aguardando Próxima Música...</h2>
                                    <p className="text-zinc-400 text-base">O administrador inserirá o link do YouTube na Área do Admin para iniciar 🎤</p>
                                </div>
                            )}
                        </div>

                        <div className="absolute bottom-4 right-6 z-10">
                            <button 
                                onClick={handleNextSong}
                                className="bg-amber-500 hover:bg-amber-600 text-zinc-950 font-bold px-6 py-3 rounded-xl shadow-lg transition-all text-sm"
                            >
                                ⏭️ Pular para Próxima da Fila
                            </button>
                        </div>
                    </div>
                );
            }

            // ==========================================
            // TELA DE LOGIN COM NOME E CELULAR
            // ==========================================
            if (!user) {
                return (
                    <div className="flex flex-col items-center justify-center min-h-screen px-4 bg-gradient-to-b from-zinc-900 to-zinc-950 py-8">
                        <div className="w-full max-w-md bg-zinc-900 border border-amber-500/30 rounded-2xl overflow-hidden shadow-2xl shadow-amber-500/10">
                            <div className="w-full h-48 sm:h-56 overflow-hidden border-b border-amber-500/30">
                                <img src="banner.jpg" alt="Toca do Guerreiro Karaokê" className="w-full h-full object-cover object-center" />
                            </div>
                            <div className="p-8">
                                <div className="text-center mb-6">
                                    <span className="bg-amber-500/10 text-amber-400 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider">Toca do Guerreiro</span>
                                    <h1 className="text-3xl font-extrabold text-amber-500 mt-3">Karaokê</h1>
                                    <p className="text-zinc-400 text-sm mt-1">Informe seus dados para participar</p>
                                </div>
                                <form onSubmit={handleLogin} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-medium text-zinc-400 mb-1">Seu Nome ou Apelido</label>
                                        <input 
                                            type="text" 
                                            required
                                            value={inputName}
                                            onChange={(e) => setInputName(e.target.value)}
                                            placeholder="Ex: João Cantor"
                                            className="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-zinc-100 focus:outline-none focus:border-amber-500 transition-colors text-sm"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-medium text-zinc-400 mb-1">Número de Celular (WhatsApp)</label>
                                        <input 
                                            type="text" 
                                            required
                                            value={inputPhone}
                                            onChange={handlePhoneChange}
                                            placeholder="(12) 99999-9999"
                                            className="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-zinc-100 focus:outline-none focus:border-amber-500 transition-colors text-sm"
                                        />
                                    </div>
                                    <button 
                                        type="submit"
                                        className="w-full bg-amber-500 hover:bg-amber-600 text-zinc-950 font-bold py-3 rounded-xl transition-all shadow-lg shadow-amber-500/20"
                                    >
                                        Entrar no Karaokê
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="max-w-4xl mx-auto px-4 py-8">
                    {/* Banner Oficial no Topo */}
                    <div className="w-full h-48 sm:h-72 rounded-2xl overflow-hidden border border-zinc-800 shadow-2xl mb-6">
                        <img src="banner.jpg" alt="Toca do Guerreiro Karaokê" className="w-full h-full object-cover object-center" />
                    </div>

                    {/* Destaque: Melhor Cantor da Noite */}
                    <div className="bg-gradient-to-r from-amber-500/20 via-amber-500/10 to-zinc-900 border border-amber-500/40 rounded-2xl p-4 sm:p-5 mb-6 flex items-center gap-4 shadow-xl shadow-amber-500/5">
                        <div className="w-12 h-12 sm:w-14 sm:h-14 rounded-2xl bg-amber-500 text-zinc-950 flex items-center justify-center text-2xl font-black shrink-0 shadow-lg shadow-amber-500/30">
                            👑
                        </div>
                        <div className="flex-1 min-w-0">
                            <span className="text-[11px] font-bold text-amber-400 uppercase tracking-widest block">Destaque da Noite</span>
                            {topSinger ? (
                                <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-1 mt-0.5">
                                    <div>
                                        <h3 className="text-lg sm:text-xl font-extrabold text-zinc-100 truncate">{topSinger.user}</h3>
                                        <p className="text-xs text-zinc-400 truncate">{topSinger.title} - {topSinger.artist}</p>
                                    </div>
                                    <div className="self-start sm:self-auto bg-amber-500/20 border border-amber-500/30 text-amber-300 text-xs font-bold px-3 py-1 rounded-xl">
                                        ★ {topSinger.avgRating.toFixed(1)} ({topSinger.totalVotes} votos)
                                    </div>
                                </div>
                            ) : (
                                <p className="text-sm text-zinc-400 mt-0.5">Ainda sem avaliações. Seja o primeiro a brilhar no topo!</p>
                            )}
                        </div>
                    </div>

                    {/* Header com dados do usuário e botão Sair */}
                    <header className="flex justify-between items-center bg-zinc-900/80 backdrop-blur border border-zinc-800 p-4 rounded-2xl mb-8">
                        <div className="flex items-center gap-4">
                            <div>
                                <span className="text-xs text-amber-400 font-semibold uppercase tracking-wider">Cantor(a) conectado(a)</span>
                                <div className="flex items-center gap-2 mt-0.5">
                                    <h2 className="text-xl font-bold text-zinc-100">{user.name}</h2>
                                    <button 
                                        onClick={handleLogout}
                                        title="Sair / Trocar de conta"
                                        className="text-[11px] bg-red-500/15 hover:bg-red-500/25 text-red-400 font-semibold px-2.5 py-1 rounded-lg border border-red-500/30 transition-colors"
                                    >
                                        Sair 🚪
                                    </button>
                                </div>
                            </div>
                        </div>
                        <div className="flex items-center gap-3">
                            {!isAdmin ? (
                                <button 
                                    onClick={() => setAdminModal(true)}
                                    className="text-xs bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-medium px-4 py-2 rounded-xl transition-colors border border-zinc-700"
                                >
                                    Área do Admin
                                </button>
                            ) : (
                                <div className="flex items-center gap-2">
                                    <span className="bg-amber-500/20 text-amber-400 text-xs font-bold px-3 py-1.5 rounded-xl border border-amber-500/30">Modo Admin Ativo</span>
                                    <button 
                                        onClick={handleAdminLogout}
                                        className="text-xs bg-red-500/20 hover:bg-red-500/30 text-red-400 font-medium px-3 py-2 rounded-xl transition-colors border border-red-500/30"
                                    >
                                        Sair Admin
                                    </button>
                                </div>
                            )}
                        </div>
                    </header>

                    {/* Painel de Controle do Admin */}
                    {isAdmin && (
                        <div className="bg-amber-500/10 border border-amber-500/30 rounded-2xl p-6 mb-8">
                            <h3 className="text-amber-400 font-bold text-lg mb-4 flex items-center gap-2">
                                👑 Painel de Administração
                            </h3>
                            <div className="flex flex-wrap gap-4 items-center">
                                <button 
                                    onClick={openTelaoWindow}
                                    className="bg-emerald-500 hover:bg-emerald-600 text-zinc-950 font-bold px-5 py-3 rounded-xl transition-all shadow-lg shadow-emerald-500/20 flex items-center gap-2 text-sm"
                                >
                                    🖥️ Abrir Modo Telão
                                </button>
                                <button 
                                    onClick={handleNextSong}
                                    className="bg-amber-500 hover:bg-amber-600 text-zinc-950 font-bold px-5 py-3 rounded-xl transition-all shadow-lg shadow-amber-500/20 flex items-center gap-2 text-sm"
                                >
                                    ⏭️ Próxima Música (Automática)
                                </button>
                                <button 
                                    onClick={handleTogglePause}
                                    className={`${isPaused ? 'bg-emerald-500 hover:bg-emerald-600 text-zinc-950' : 'bg-amber-500/20 hover:bg-amber-500/30 text-amber-400 border border-amber-500/40'} font-bold px-5 py-3 rounded-xl transition-all text-sm`}
                                >
                                    {isPaused ? '▶️ Retomar Pedidos' : '⏸️ Pausar Pedidos'}
                                </button>

                                {/* Botão Liga/Desliga Pular Automático (5 min) */}
                                <button 
                                    onClick={() => setAutoSkipEnabled(!autoSkipEnabled)}
                                    className={`${autoSkipEnabled ? 'bg-emerald-500 text-zinc-950 font-black' : 'bg-zinc-800 text-zinc-400 border border-zinc-700 font-medium'} px-4 py-3 rounded-xl transition-all text-xs flex items-center gap-2`}
                                >
                                    <span>⏱️ Pular Automático (5 min):</span>
                                    <span className="underline">{autoSkipEnabled ? 'ATIVADO' : 'DESATIVADO'}</span>
                                </button>

                                <button 
                                    onClick={handleResetNotes}
                                    className="bg-red-500/20 hover:bg-red-500/30 text-red-400 border border-red-500/40 font-bold px-5 py-3 rounded-xl transition-all text-sm"
                                >
                                    🗑️ Zerar Notas e Histórico
                                </button>
                            </div>
                        </div>
                    )}

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                        {/* Formulário para Pedir Música Simples */}
                        <div className="md:col-span-1">
                            <div className="bg-zinc-900 border border-zinc-800 rounded-2xl p-6 sticky top-6">
                                <h3 className="text-lg font-bold text-zinc-100 mb-4">Pedir Música</h3>
                                <form onSubmit={handleAddSong} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-medium text-zinc-400 mb-1">Música</label>
                                        <input 
                                            type="text" 
                                            required
                                            value={songTitle}
                                            onChange={(e) => setSongTitle(e.target.value)}
                                            placeholder="Ex: Evidências"
                                            className="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-2.5 text-zinc-100 focus:outline-none focus:border-amber-500 text-sm"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-medium text-zinc-400 mb-1">Artista / Banda</label>
                                        <input 
                                            type="text" 
                                            required
                                            value={songArtist}
                                            onChange={(e) => setSongArtist(e.target.value)}
                                            placeholder="Ex: Chitãozinho & Xororó"
                                            className="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-2.5 text-zinc-100 focus:outline-none focus:border-amber-500 text-sm"
                                        />
                                    </div>
                                    <button 
                                        type="submit"
                                        className="w-full bg-amber-500 hover:bg-amber-600 text-zinc-950 font-bold py-3 rounded-xl transition-all shadow-lg shadow-amber-500/20 text-sm"
                                    >
                                        Pedir para o Telão 🎤
                                    </button>
                                </form>
                            </div>
                        </div>

                        {/* Fila de Espera com Campo de Link Sincronizado para todos os Admins */}
                        <div className="md:col-span-2 space-y-8">
                            <div className="bg-zinc-900 border border-zinc-800 rounded-2xl p-6">
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="text-lg font-bold text-zinc-100">Fila de Espera</h3>
                                    <span className="bg-zinc-800 text-zinc-300 text-xs font-bold px-2.5 py-1 rounded-lg">{queue.length} na fila</span>
                                </div>

                                {queue.length === 0 ? (
                                    <div className="text-center py-8 text-zinc-500 text-sm border border-dashed border-zinc-800 rounded-xl">
                                        Nenhuma música na fila no momento. Peça a primeira!
                                    </div>
                                ) : (
                                    <div className="space-y-4">
                                        {queue.map((item, index) => (
                                            <div key={item.id} className="bg-zinc-950 border border-zinc-800/80 p-4 rounded-xl flex flex-col gap-3">
                                                <div className="flex items-center justify-between gap-4">
                                                    <div className="flex items-center gap-3">
                                                        <span className={`w-7 h-7 rounded-lg flex items-center justify-center font-bold text-xs ${index === 0 ? 'bg-amber-500 text-zinc-950' : 'bg-zinc-800 text-zinc-400'}`}>
                                                            {index + 1}
                                                        </span>
                                                        <div>
                                                            <h4 className="font-bold text-zinc-100 text-sm">{item.title}</h4>
                                                            <p className="text-xs text-zinc-400">{item.artist} • <span className="text-amber-400 font-medium">{item.user}</span></p>
                                                        </div>
                                                    </div>
                                                    
                                                    <div className="flex items-center gap-2">
                                                        {isAdmin && (
                                                            <button 
                                                                onClick={() => setEditingSong(item)}
                                                                className="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 text-xs px-3 py-1.5 rounded-lg transition-colors border border-zinc-700"
                                                            >
                                                                Editar
                                                            </button>
                                                        )}
                                                        {isAdmin && (
                                                            <button 
                                                                onClick={() => handleDeleteSong(item.id)}
                                                                className="bg-red-500/20 hover:bg-red-500/30 text-red-400 text-xs px-3 py-1.5 rounded-lg transition-colors border border-red-500/30"
                                                            >
                                                                Excluir
                                                            </button>
                                                        )}
                                                    </div>
                                                </div>

                                                {/* Controles para o Admin com Link Sincronizado via Firebase */}
                                                {isAdmin && (
                                                    <div className="flex flex-col sm:flex-row items-center gap-2 pt-2 border-t border-zinc-900">
                                                        <input 
                                                            type="text"
                                                            placeholder="Cole o link do YouTube aqui..."
                                                            value={youtubeInputs[item.id] !== undefined ? youtubeInputs[item.id] : (item.youtubeLink || '')}
                                                            onChange={(e) => setYoutubeInputs({ ...youtubeInputs, [item.id]: e.target.value })}
                                                            className="w-full sm:flex-1 bg-zinc-900 border border-zinc-800 rounded-xl px-3 py-2 text-xs text-zinc-100 focus:outline-none focus:border-amber-500"
                                                        />
                                                        <div className="flex items-center gap-2 w-full sm:w-auto justify-end">
                                                            <button 
                                                                onClick={() => handleSaveYouTubeLink(item.id)}
                                                                className="bg-zinc-800 hover:bg-zinc-700 text-amber-400 border border-amber-500/30 font-semibold text-xs px-3 py-2 rounded-xl transition-all"
                                                            >
                                                                💾 Salvar Link
                                                            </button>
                                                            <button 
                                                                onClick={() => handlePlayOnTelao(item)}
                                                                className="bg-emerald-500 hover:bg-emerald-600 text-zinc-950 font-bold text-xs px-4 py-2 rounded-xl transition-all shadow-md shadow-emerald-500/20"
                                                            >
                                                                ▶️ Tocar Música
                                                            </button>
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>

                            {/* Ranking / Músicas Tocadas e Avaliadas */}
                            <div className="bg-zinc-900 border border-zinc-800 rounded-2xl p-6">
                                <h3 className="text-lg font-bold text-zinc-100 mb-1">Ranking de Performances</h3>
                                <p className="text-xs text-zinc-400 mb-4">Avalie de 1 a 5 estrelas as apresentações que já aconteceram!</p>

                                {rankedHistory.length === 0 ? (
                                    <div className="text-center py-8 text-zinc-500 text-sm border border-dashed border-zinc-800 rounded-xl">
                                        Nenhuma música tocada ainda.
                                    </div>
                                ) : (
                                    <div className="space-y-3">
                                        {rankedHistory.map((item, index) => {
                                            const userRating = (ratings[item.id] || {})[user.phone] || 0;
                                            const isOwner = item.phone === user.phone;

                                            return (
                                                <div key={item.id} className="bg-zinc-950 border border-zinc-800/80 p-4 rounded-xl flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                                                    <div>
                                                        <div className="flex items-center gap-2">
                                                            <span className="text-xs font-bold text-amber-500">#{index + 1} no Ranking</span>
                                                            {item.avgRating > 0 && (
                                                                <span className="bg-amber-500/10 text-amber-400 text-xs font-semibold px-2 py-0.5 rounded border border-amber-500/20">
                                                                    ★ {item.avgRating.toFixed(1)} ({item.totalVotes} {item.totalVotes === 1 ? 'voto' : 'votos'})
                                                                </span>
                                                            )}
                                                        </div>
                                                        <h4 className="font-bold text-zinc-100 text-sm mt-1">{item.title} - {item.artist}</h4>
                                                        <p className="text-xs text-zinc-400">Cantado por: <span className="text-amber-400 font-medium">{item.user}</span></p>
                                                    </div>

                                                    {/* Sistema de Votação por Estrelas */}
                                                    <div>
                                                        {isOwner ? (
                                                            <span className="bg-zinc-900 text-zinc-500 text-[11px] font-medium px-3 py-2 rounded-xl border border-zinc-800 block text-center">
                                                                Você não pode votar na sua música
                                                            </span>
                                                        ) : (
                                                            <div className="flex items-center gap-1 bg-zinc-900 px-3 py-2 rounded-xl border border-zinc-800 self-start sm:self-auto">
                                                                <span className="text-[10px] text-zinc-400 mr-1 font-medium">Sua nota:</span>
                                                                {[1, 2, 3, 4, 5].map((star) => (
                                                                    <button
                                                                        key={star}
                                                                        onClick={() => handleRate(item.id, star)}
                                                                        className={`text-base transition-transform hover:scale-125 ${star <= userRating ? 'text-amber-400' : 'text-zinc-700'}`}
                                                                    >
                                                                        ★
                                                                    </button>
                                                                ))}
                                                            </div>
                                                        )}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>

                    {/* Pop-up (Modal) com Vídeo Vertical e Botão Dedicado de Ativar Som */}
                    {showPausedModal && (
                        <div className="fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 z-50">
                            <div className="bg-zinc-900 border border-amber-500/50 rounded-2xl p-6 w-full max-w-xs sm:max-w-sm shadow-2xl shadow-amber-500/10 text-center">
                                <div className="w-full aspect-[9/16] max-h-[50vh] rounded-xl overflow-hidden mb-3 border border-amber-500/30 bg-black mx-auto relative flex items-center justify-center">
                                    <video 
                                        ref={videoRef}
                                        src="mensagem.mp4" 
                                        autoPlay 
                                        loop 
                                        muted={isVideoMuted}
                                        playsInline
                                        className="w-full h-full object-cover"
                                    >
                                        Seu navegador não suporta vídeos.
                                    </video>
                                    
                                    {isVideoMuted && (
                                        <button 
                                            type="button"
                                            onClick={handleUnmuteVideo}
                                            className="absolute bottom-3 bg-amber-500 hover:bg-amber-600 text-zinc-950 font-bold text-xs px-4 py-2 rounded-full shadow-lg flex items-center gap-1.5 animate-bounce transition-all"
                                        >
                                            🔊 Ligar Som do Vídeo
                                        </button>
                                    )}
                                </div>
                                <h3 className="text-xl font-extrabold text-amber-500 mb-1">Que pena que acabou!</h3>
                                <p className="text-xs text-zinc-300 leading-relaxed mb-4">
                                    Os pedidos de músicas foram pausados pelo administrador. Obrigado a todos pela participação na Toca do Guerreiro!
                                </p>
                                <button 
                                    type="button"
                                    onClick={() => setShowPausedModal(false)}
                                    className="w-full bg-zinc-800 hover:bg-zinc-700 text-zinc-200 font-bold py-2.5 rounded-xl transition-colors text-sm border border-zinc-700"
                                >
                                    Fechar 👍
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Modal de Senha do Admin */}
                    {adminModal && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-zinc-900 border border-zinc-800 rounded-2xl p-6 w-full max-w-md shadow-2xl">
                                <h3 className="text-lg font-bold text-zinc-100 mb-2">Acesso Restrito</h3>
                                <p className="text-xs text-zinc-400 mb-4">Insira a senha de administrador para gerenciar o Karaokê.</p>
                                <form onSubmit={handleAdminLogin} className="space-y-4">
                                    <input 
                                        type="password" 
                                        required
                                        value={adminPassword}
                                        onChange={(e) => setAdminPassword(e.target.value)}
                                        placeholder="Senha"
                                        className="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-zinc-100 focus:outline-none focus:border-amber-500 text-sm"
                                    />
                                    <div className="flex gap-3">
                                        <button 
                                            type="button"
                                            onClick={() => setAdminModal(false)}
                                            className="w-1/2 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-medium py-3 rounded-xl transition-colors text-sm"
                                        >
                                            Cancelar
                                        </button>
                                        <button 
                                            type="submit"
                                            className="w-1/2 bg-amber-500 hover:bg-amber-600 text-zinc-950 font-bold py-3 rounded-xl transition-colors text-sm shadow-lg shadow-amber-500/20"
                                        >
                                            Entrar
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Modal de Edição de Música (Admin) */}
                    {editingSong && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-zinc-900 border border-zinc-800 rounded-2xl p-6 w-full max-w-md shadow-2xl">
                                <h3 className="text-lg font-bold text-zinc-100 mb-4">Editar Música da Fila</h3>
                                <form onSubmit={handleSaveEdit} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-medium text-zinc-400 mb-1">Música</label>
                                        <input 
                                            type="text" 
                                            required
                                            value={editingSong.title}
                                            onChange={(e) => setEditingSong({ ...editingSong, title: e.target.value })}
                                            className="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-2.5 text-zinc-100 focus:outline-none focus:border-amber-500 text-sm"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-medium text-zinc-400 mb-1">Artista / Banda</label>
                                        <input 
                                            type="text" 
                                            required
                                            value={editingSong.artist}
                                            onChange={(e) => setEditingSong({ ...editingSong, artist: e.target.value })}
                                            className="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-2.5 text-zinc-100 focus:outline-none focus:border-amber-500 text-sm"
                                        />
                                    </div>
                                    <div className="flex gap-3 pt-2">
                                        <button 
                                            type="button"
                                            onClick={() => setEditingSong(null)}
                                            className="w-1/2 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-medium py-3 rounded-xl transition-colors text-sm"
                                        >
                                            Cancelar
                                        </button>
                                        <button 
                                            type="submit"
                                            className="w-1/2 bg-amber-500 hover:bg-amber-600 text-zinc-950 font-bold py-3 rounded-xl transition-colors text-sm shadow-lg shadow-amber-500/20"
                                        >
                                            Salvar Alterações
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
