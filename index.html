<body class="bg-zinc-950 text-zinc-100 min-h-screen">
    <div id="root"></div>

    <script>
        const { useState, useEffect, useRef } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyCW9c9Uv0kekNSu1E6Y32toewgWm4Ngeps",
            authDomain: "karaoke-toca-30cf3.firebaseapp.com",
            projectId: "karaoke-toca-30cf3",
            storageBucket: "karaoke-toca-30cf3.firebasestorage.app",
            messagingSenderId: "722633752685",
            appId: "1:722633752685:web:7ac81abddc58e9aef27f64"
        };

        const YOUTUBE_API_KEY = "AIzaSyDsv-VNFmBbyaBSJcb-50_plCp5xCycSV4"; 

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        function playBeep(isHigh = false) {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();

                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = 'sine';
                osc.frequency.value = isHigh ? 880 : 440;

                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.4);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start();
                osc.stop(ctx.currentTime + 0.4);
            } catch (e) {
                console.error("Erro ao reproduzir bip:", e);
            }
        }

        function playStarSound() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();

                const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51]; 
                notes.forEach((freq, index) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();

                    osc.type = 'triangle';
                    osc.frequency.value = freq;

                    const startTime = ctx.currentTime + (index * 0.08);
                    gain.gain.setValueAtTime(0.25, startTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.7);

                    osc.connect(gain);
                    gain.connect(ctx.destination);

                    osc.start(startTime);
                    osc.stop(startTime + 0.7);
                });
            } catch (e) {
                console.error("Erro ao reproduzir som de estrelas:", e);
            }
        }

        function getYouTubeVideoId(url) {
            if (!url) return '';
            let videoId = '';
            if (url.includes('youtu.be/')) {
                videoId = url.split('youtu.be/')[1]?.split('?')[0];
            } else if (url.includes('watch?v=')) {
                videoId = url.split('watch?v=')[1]?.split('&')[0];
            } else if (url.includes('embed/')) {
                videoId = url.split('embed/')[1]?.split('?')[0];
            } else {
                videoId = url;
            }
            return videoId;
        }

        async function fetchYouTubeApiLink(title, artist) {
            if (!YOUTUBE_API_KEY) return "";
            try {
                const query = encodeURIComponent(`${title} ${artist} karaoke instrumental`);
                const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=1&q=${query}&type=video&key=${YOUTUBE_API_KEY}`;
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.items && data.items.length > 0) {
                    const videoId = data.items[0].id.videoId;
                    return `https://www.youtube.com/watch?v=${videoId}`;
                }
            } catch (e) {
                console.error("Erro ao buscar link na API do YouTube:", e);
            }
            return "";
        }

        function App() {
            const [user, setUser] = useState(() => {
                const saved = localStorage.getItem('toca_karaoke_user');
                if (saved) {
                    const data = JSON.parse(saved);
                    if (new Date().getTime() - data.timestamp < 12 * 60 * 60 * 1000) {
                        return data;
                    }
                }
                return null;
            });

            const [inputName, setInputName] = useState('');
            const [inputPhone, setInputPhone] = useState('');
            const [songTitle, setSongTitle] = useState('');
            const [songArtist, setSongArtist] = useState('');
            const [isSearchingAuto, setIsSearchingAuto] = useState(false);
            
            const [queue, setQueue] = useState([]);
            const queueRef = useRef(queue);
            useEffect(() => { queueRef.current = queue; }, [queue]);

            const [history, setHistory] = useState([]);
            const [floatingHearts, setFloatingHearts] = useState([]);
            const [starMessages, setStarMessages] = useState([]);

            const [isPaused, setIsPaused] = useState(false);
            const [isTelaoMode, setIsTelaoMode] = useState(false);
            const [activePlayingSong, setActivePlayingSong] = useState(null);
            
            const [backgroundLinkInput, setBackgroundLinkInput] = useState('');
            const [backgroundSongActive, setBackgroundSongActive] = useState(null);
            const [isTelaoMutedState, setIsTelaoMutedState] = useState(false);

            const [introCountdown, setIntroCountdown] = useState(null);
            const introTimerRef = useRef(null);

            const [showPausedModal, setShowPausedModal] = useState(false);
            const [isVideoMuted, setIsVideoMuted] = useState(true);
            const videoRef = useRef(null);

            const [isAdmin, setIsAdmin] = useState(() => {
                const adminSaved = localStorage.getItem('toca_karaoke_admin');
                if (adminSaved) {
                    const adminData = JSON.parse(adminSaved);
                    if (new Date().getTime() - adminData.timestamp < 24 * 60 * 60 * 1000) {
                        return true;
                    }
                }
                return false;
            });

            const [adminModal, setAdminModal] = useState(false);
            const [adminPassword, setAdminPassword] = useState('');
            const [editingSong, setEditingSong] = useState(null);
            const [youtubeInputs, setYoutubeInputs] = useState({});

            const [usersList, setUsersList] = useState([]);
            const [mutedPhones, setMutedPhones] = useState({});
            const [showUsersModal, setShowUsersModal] = useState(false);
            const [mutedAlertMessage, setMutedAlertMessage] = useState(null);

            const ytPlayerRef = useRef(null);
            const currentVideoIdRef = useRef(null);
            const lastSongIdProcessedRef = useRef(null);
            const checkEndIntervalRef = useRef(null);

            const activePlayingSongRef = useRef(activePlayingSong);
            useEffect(() => { activePlayingSongRef.current = activePlayingSong; }, [activePlayingSong]);

            const backgroundSongActiveRef = useRef(backgroundSongActive);
            useEffect(() => { backgroundSongActiveRef.current = backgroundSongActive; }, [backgroundSongActive]);

            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                if (params.get('telao') === 'true') {
                    setIsTelaoMode(true);
                }
            }, []);

            const triggerFloatingHeart = () => {
                const newHeartId = Date.now() + Math.random();
                setFloatingHearts(prev => [...prev, newHeartId]);
                setTimeout(() => {
                    setFloatingHearts(prev => prev.filter(id => id !== newHeartId));
                }, 2500);
            };

            const triggerStarCelebration = () => {
                const newMsgId = Date.now() + Math.random();
                setStarMessages(prev => [...prev, newMsgId]);
                playStarSound();
                setTimeout(() => {
                    setStarMessages(prev => prev.filter(id => id !== newMsgId));
                }, 3000);
            };

            const handleNextSong = async () => {
                const currentQueue = queueRef.current;
                const currentActive = activePlayingSongRef.current;
                const currentBg = backgroundSongActiveRef.current;
                
                if (currentActive && currentActive.id && !currentBg) {
                    try {
                        await db.collection('history').add({
                            title: currentActive.title,
                            artist: currentActive.artist,
                            user: currentActive.user,
                            phone: currentActive.phone || '',
                            likes: 0,
                            likedPhones: [],
                            createdAt: firebase.firestore.FieldValue.serverTimestamp()
                        });
                    } catch (err) {
                        console.error("Erro ao salvar histórico ao avançar:", err);
                    }
                }

                if (currentQueue.length === 0) {
                    await db.collection('settings').doc('activePlaying').set({ song: null });
                    await db.collection('settings').doc('backgroundSong').set({ song: null });
                    return;
                }

                const current = currentQueue[0];
                try {
                    await db.collection('queue').doc(current.id).delete();

                    const nextSong = currentQueue.length > 1 ? currentQueue[1] : null;
                    if (nextSong && nextSong.youtubeLink) {
                        const videoId = getYouTubeVideoId(nextSong.youtubeLink);
                        await db.collection('settings').doc('backgroundSong').set({ song: null });
                        await db.collection('settings').doc('activePlaying').set({ 
                            song: { ...nextSong, videoId: videoId, timestamp: Date.now() } 
                        });
                    } else {
                        await db.collection('settings').doc('activePlaying').set({ song: null });
                    }
                } catch (error) {
                    console.error("Erro ao avançar música: ", error);
                }
            };

            useEffect(() => {
                const unsubQueue = db.collection('queue').orderBy('createdAt', 'asc').onSnapshot(snapshot => {
                    const items = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setQueue(items);
                });

                const unsubHistory = db.collection('history').orderBy('createdAt', 'desc').onSnapshot(snapshot => {
                    const items = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setHistory(items);
                });

                const unsubCelebration = db.collection('settings').doc('celebration').onSnapshot(doc => {
                    if (doc.exists && isTelaoMode) {
                        const data = doc.data();
                        if (data && data.timestamp && (Date.now() - data.timestamp < 5000)) {
                            triggerFloatingHeart();
                            if (data.type === 'stars') {
                                triggerStarCelebration();
                            }
                        }
                    }
                });

                const unsubSettings = db.collection('settings').doc('status').onSnapshot(doc => {
                    if (doc.exists) {
                        setIsPaused(doc.data().paused || false);
                    }
                });

                const unsubActive = db.collection('settings').doc('activePlaying').onSnapshot(doc => {
                    if (doc.exists) {
                        const newSong = doc.data().song || null;
                        if (newSong) {
                            setActivePlayingSong(newSong);
                        } else {
                            setActivePlayingSong(null);
                        }
                    }
                });

                const unsubBg = db.collection('settings').doc('backgroundSong').onSnapshot(doc => {
                    if (doc.exists) {
                        setBackgroundSongActive(doc.data().song || null);
                    }
                });

                const unsubTelaoMute = db.collection('settings').doc('telaoMute').onSnapshot(doc => {
                    if (doc.exists) {
                        const muted = doc.data().muted || false;
                        setIsTelaoMutedState(muted);
                        if (ytPlayerRef.current && typeof ytPlayerRef.current.pauseVideo === 'function' && typeof ytPlayerRef.current.playVideo === 'function') {
                            if (muted) {
                                ytPlayerRef.current.pauseVideo();
                            } else {
                                ytPlayerRef.current.playVideo();
                            }
                        }
                    }
                });

                const unsubUsers = db.collection('users').onSnapshot(snapshot => {
                    const items = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setUsersList(items);
                });

                const unsubMuted = db.collection('settings').doc('mutedUsers').onSnapshot(doc => {
                    if (doc.exists) {
                        setMutedPhones(doc.data() || {});
                    }
                });

                return () => {
                    unsubQueue();
                    unsubHistory();
                    unsubCelebration();
                    unsubSettings();
                    unsubActive();
                    unsubBg();
                    unsubTelaoMute();
                    unsubUsers();
                    unsubMuted();
                };
            }, [isTelaoMode]);

            useEffect(() => {
                if (!isTelaoMode || !activePlayingSong || backgroundSongActive) return;
                
                const songUniqueKey = `${activePlayingSong.id || activePlayingSong.videoId}-${activePlayingSong.timestamp || 0}`;
                if (lastSongIdProcessedRef.current === songUniqueKey) return;
                lastSongIdProcessedRef.current = songUniqueKey;

                let count = 3;
                setIntroCountdown({ song: activePlayingSong, count: count });
                playBeep(false);

                if (introTimerRef.current) clearInterval(introTimerRef.current);

                introTimerRef.current = setInterval(() => {
                    count--;
                    if (count > 0) {
                        playBeep(false);
                        setIntroCountdown(prev => prev ? { ...prev, count: count } : null);
                    } else {
                        playBeep(true);
                        clearInterval(introTimerRef.current);
                        setIntroCountdown(null);
                        if (ytPlayerRef.current && typeof ytPlayerRef.current.playVideo === 'function' && !isTelaoMutedState) {
                            ytPlayerRef.current.unMute();
                            ytPlayerRef.current.playVideo();
                        }
                    }
                }, 1000);

                return () => {
                    if (introTimerRef.current) clearInterval(introTimerRef.current);
                };
            }, [activePlayingSong, isTelaoMode]);

            useEffect(() => {
                if (queue.length > 0 && backgroundSongActive && !activePlayingSong) {
                    const firstSong = queue[0];
                    if (firstSong.youtubeLink) {
                        const videoId = getYouTubeVideoId(firstSong.youtubeLink);
                        if (videoId) {
                            db.collection('settings').doc('backgroundSong').set({ song: null });
                            db.collection('settings').doc('activePlaying').set({ 
                                song: { ...firstSong, videoId: videoId, timestamp: Date.now() } 
                            });
                        }
                    }
                }
            }, [queue, backgroundSongActive, activePlayingSong]);

            // Verificador de término exato do vídeo por segundo (Garante o avanço automático sem falhar)
            useEffect(() => {
                if (!isTelaoMode) return;

                if (checkEndIntervalRef.current) clearInterval(checkEndIntervalRef.current);

                checkEndIntervalRef.current = setInterval(() => {
                    if (ytPlayerRef.current && typeof ytPlayerRef.current.getCurrentTime === 'function' && typeof ytPlayerRef.current.getDuration === 'function') {
                        const currentTime = ytPlayerRef.current.getCurrentTime();
                        const duration = ytPlayerRef.current.getDuration();
                        
                        // Se o vídeo estiver tocando e faltar menos de 0.8 segundos para acabar (ou já tiver acabado)
                        if (duration > 0 && currentTime > 0 && (duration - currentTime < 0.8)) {
                            clearInterval(checkEndIntervalRef.current);
                            if (!backgroundSongActiveRef.current) {
                                handleNextSong();
                            } else {
                                ytPlayerRef.current.seekTo(0);
                                ytPlayerRef.current.playVideo();
                            }
                        }
                    }
                }, 1000);

                return () => {
                    if (checkEndIntervalRef.current) clearInterval(checkEndIntervalRef.current);
                };
            }, [isTelaoMode, activePlayingSong, backgroundSongActive]);

            useEffect(() => {
                if (!isTelaoMode) return;
                const currentPlaying = backgroundSongActive || activePlayingSong;
                const videoId = currentPlaying ? (currentPlaying.videoId || getYouTubeVideoId(currentPlaying.youtubeLink)) : null;

                if (!videoId) {
                    if (ytPlayerRef.current && typeof ytPlayerRef.current.destroy === 'function') {
                        ytPlayerRef.current.destroy();
                        ytPlayerRef.current = null;
                    }
                    currentVideoIdRef.current = null;
                    return;
                }

                if (ytPlayerRef.current && typeof ytPlayerRef.current.loadVideoById === 'function') {
                    if (currentVideoIdRef.current !== videoId || (currentPlaying && currentPlaying.timestamp)) {
                        currentVideoIdRef.current = videoId;
                        ytPlayerRef.current.loadVideoById(videoId);
                        ytPlayerRef.current.unMute();
                        ytPlayerRef.current.playVideo();
                    }
                    return;
                }

                currentVideoIdRef.current = videoId;

                const initPlayer = () => {
                    if (window.YT && window.YT.Player) {
                        if (ytPlayerRef.current && typeof ytPlayerRef.current.destroy === 'function') {
                            try { ytPlayerRef.current.destroy(); } catch(e){}
                        }
                        ytPlayerRef.current = new YT.Player('youtube-player-container', {
                            height: '100%',
                            width: '100%',
                            videoId: videoId,
                            playerVars: {
                                'autoplay': 1,
                                'enablejsapi': 1,
                                'controls': 1,
                                'mute': 0,
                                'modestbranding': 1,
                                'rel': 0
                            },
                            events: {
                                'onReady': (event) => {
                                    event.target.unMute();
                                    if (isTelaoMutedState) {
                                        event.target.pauseVideo();
                                    } else {
                                        event.target.playVideo();
                                    }
                                },
                                'onStateChange': (event) => {
                                    if (event.data === YT.PlayerState.ENDED) {
                                        if (!backgroundSongActiveRef.current) {
                                            handleNextSong();
                                        } else {
                                            event.target.seekTo(0);
                                            event.target.playVideo();
                                        }
                                    }
                                }
                            }
                        });
                    }
                };

                if (!window.YT || !window.YT.Player) {
                    window.onYouTubeIframeAPIReady = initPlayer;
                    setTimeout(initPlayer, 1000);
                } else {
                    initPlayer();
                }

            }, [isTelaoMode, activePlayingSong, backgroundSongActive]);

            const handleToggleTelaoPlayPause = async () => {
                const newMuteState = !isTelaoMutedState;
                try {
                    await db.collection('settings').doc('telaoMute').set({ muted: newMuteState });
                } catch (error) {
                    console.error("Erro ao alterar estado do telão: ", error);
                }
            };

            const handlePhoneChange = (e) => {
                let value = e.target.value.replace(/\D/g, '');
                if (value.length > 11) value = value.slice(0, 11);
                
                if (value.length > 6) {
                    value = `(${value.slice(0, 2)}) ${value.slice(2, 7)}-${value.slice(7)}`;
                } else if (value.length > 2) {
                    value = `(${value.slice(0, 2)}) ${value.slice(2)}`;
                } else if (value.length > 0) {
                    value = `(${value}`;
                }
                setInputPhone(value);
            };

            const handleLogin = async (e) => {
                e.preventDefault();
                if (!inputName.trim() || !inputPhone.trim()) return;
                const nameFormatted = inputName.trim();
                const phoneFormatted = inputPhone.trim();

                const userData = {
                    name: nameFormatted,
                    phone: phoneFormatted,
                    timestamp: new Date().getTime()
                };

                setUser(userData);
                localStorage.setItem('toca_karaoke_user', JSON.stringify(userData));

                try {
                    const cleanPhoneId = phoneFormatted.replace(/\D/g, '');
                    await db.collection('users').doc(cleanPhoneId).set({
                        name: nameFormatted,
                        phone: phoneFormatted,
                        lastLogin: firebase.firestore.FieldValue.serverTimestamp()
                    });
                } catch (err) {
                    console.error("Erro ao registrar usuário no Firestore:", err);
                }

                setInputName('');
                setInputPhone('');
            };

            const handleLogout = () => {
                if (confirm('Deseja realmente sair da sua conta?')) {
                    localStorage.removeItem('toca_karaoke_user');
                    setUser(null);
                }
            };

            const userActiveSongsCount = user ? queue.filter(item => item.phone === user.phone).length : 0;

            const handleToggleMuteUser = async (phone) => {
                const cleanPhone = phone.replace(/\D/g, '');
                const isCurrentlyMuted = !!mutedPhones[cleanPhone];
                const updatedMuted = { ...mutedPhones, [cleanPhone]: !isCurrentlyMuted };
                
                try {
                    await db.collection('settings').doc('mutedUsers').set(updatedMuted);
                } catch (error) {
                    console.error("Erro ao alterar silenciamento: ", error);
                }
            };

            const handleDeleteUser = async (userId, userName) => {
                if (confirm(`Tem certeza que deseja deletar o usuário "${userName}"?`)) {
                    try {
                        await db.collection('users').doc(userId).delete();
                    } catch (error) {
                        console.error("Erro ao deletar usuário: ", error);
                        alert("Erro ao deletar usuário.");
                    }
                }
            };

            const handleAddSong = async (e) => {
                e.preventDefault();

                const cleanUserPhone = user.phone ? user.phone.replace(/\D/g, '') : '';
                if (mutedPhones[cleanUserPhone]) {
                    setMutedAlertMessage(`${user.name} você está impedida de pedir músicas agora. Chama o guerreiro para saber o qué aconteceu.`);
                    return;
                }
                
                if (isPaused) {
                    setIsVideoMuted(true);
                    setShowPausedModal(true);
                    return;
                }

                if (!songTitle.trim() || !songArtist.trim()) return;

                if (userActiveSongsCount >= 2) {
                    alert('Você já possui 2 músicas na fila! Aguarde uma delas tocar para pedir outra.');
                    return;
                }

                setIsSearchingAuto(true);

                try {
                    const finalLink = await fetchYouTubeApiLink(songTitle.trim(), songArtist.trim());
                    const videoId = getYouTubeVideoId(finalLink);

                    if (!videoId) {
                        alert('Não foi possível encontrar um vídeo de karaokê automaticamente para esta música. Tente digitar o artista e o nome de outra forma.');
                        setIsSearchingAuto(false);
                        return;
                    }

                    const songData = {
                        title: songTitle.trim(),
                        artist: songArtist.trim(),
                        user: user.name,
                        phone: user.phone,
                        youtubeLink: finalLink,
                        videoId: videoId,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    };

                    const docRef = await db.collection('queue').add(songData);
                    
                    if (!activePlayingSong && !backgroundSongActive && videoId) {
                        await db.collection('settings').doc('activePlaying').set({ 
                            song: { id: docRef.id, ...songData, timestamp: Date.now() } 
                        });
                    }

                    setSongTitle('');
                    setSongArtist('');
                    alert('Música encontrada e enviada para o telão com sucesso! 🎤');
                } catch (error) {
                    console.error("Erro ao adicionar música: ", error);
                    alert('Erro ao processar o pedido. Tente novamente.');
                } finally {
                    setIsSearchingAuto(false);
                }
            };

            const handleUnmuteVideo = () => {
                if (videoRef.current) {
                    videoRef.current.muted = false;
                    videoRef.current.play();
                    setIsVideoMuted(false);
                }
            };

            const handleAdminLogin = (e) => {
                e.preventDefault();
                if (adminPassword === 'toca10karaoke') {
                    setIsAdmin(true);
                    localStorage.setItem('toca_karaoke_admin', JSON.stringify({ timestamp: new Date().getTime() }));
                    setAdminModal(false);
                    setAdminPassword('');
                } else {
                    alert('Senha incorreta!');
                }
            };

            const handleAdminLogout = () => {
                localStorage.removeItem('toca_karaoke_admin');
                setIsAdmin(false);
